name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: brevly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3333
      DATABASE_URL: postgresql://docker:docker@localhost:5432/brevly_test
      CLOUDFLARE_ACCOUNT_ID: test
      CLOUDFLARE_ACCESS_KEY_ID: test
      CLOUDFLARE_SECRET_ACCESS_KEY: test
      CLOUDFLARE_BUCKET: test
      CLOUDFLARE_PUBLIC_URL: http://localhost:3333

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build -t brevly-server .

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_FRONTEND_URL: http://localhost:5173
      VITE_BACKEND_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
